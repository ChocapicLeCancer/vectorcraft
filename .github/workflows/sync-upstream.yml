
name: Daily VectorCraft Sync

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout fork
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.SYNC_TOKEN }}
      - name: Fetch upstream branches and tags
        run: |
          git remote add upstream https://github.com/storytold/vectorcraft.git
          git fetch upstream \
            "+refs/heads/*:refs/remotes/upstream/*" \
            "+refs/tags/*:refs/upstream/tags/*"

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

     
      - name: Synchronize all other branches
        shell: bash
        run: |
          mapfile -t refs < <(
            git for-each-ref --format='%(refname)' refs/remotes/upstream
          )

          refs_to_push=()

          for ref in "${refs[@]}"; do
            branch="${ref#refs/remotes/upstream/}"

            if [[ "$branch" == "main" ]]; then
              continue
            fi

            refs_to_push+=("$ref:refs/heads/$branch")
          done

          echo "Branches à synchroniser : ${#refs_to_push[@]}"

          batch_size=10
          failures=0

          for ((i=0; i<${#refs_to_push[@]}; i+=batch_size)); do
            batch=("${refs_to_push[@]:i:batch_size}")

            echo "Envoi du lot $((i / batch_size + 1))"

            if ! git push --force origin "${batch[@]}"; then
              echo "Échec du lot, nouvelle tentative branche par branche."

              for refspec in "${batch[@]}"; do
                if ! git push --force origin "$refspec"; then
                  echo "::warning::Échec de synchronisation : $refspec"
                  failures=$((failures + 1))
                fi
              done
            fi
          done

          if [[ "$failures" -gt 0 ]]; then
            echo "::error::$failures branche(s) n'ont pas pu être synchronisées."
            exit 1
          fi

      - name: Synchronize all tags
        shell: bash
        run: |
          mapfile -t refs < <(
            git for-each-ref --format='%(refname)' refs/upstream/tags
          )

          refs_to_push=()

          for ref in "${refs[@]}"; do
            tag="${ref#refs/upstream/tags/}"
            refs_to_push+=("$ref:refs/tags/$tag")
          done

          echo "Tags à synchroniser : ${#refs_to_push[@]}"

          batch_size=10
          failures=0

          for ((i=0; i<${#refs_to_push[@]}; i+=batch_size)); do
            batch=("${refs_to_push[@]:i:batch_size}")

            if ! git push --force origin "${batch[@]}"; then
              echo "Échec du lot, nouvelle tentative tag par tag."

              for refspec in "${batch[@]}"; do
                if ! git push --force origin "$refspec"; then
                  echo "::warning::Échec de synchronisation : $refspec"
                  failures=$((failures + 1))
                fi
              done
            fi
          done

          if [[ "$failures" -gt 0 ]]; then
            echo "::error::$failures tag(s) n'ont pas pu être synchronisés."
            exit 1
          fi
